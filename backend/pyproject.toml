[project]
name = "bandera"
version = "0.1.0"
description = "AI feature flags with gradual rollout, statistical gating and kill-switch"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bandera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
